<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Lecture Player</title></head>
<body><header><a class="brand" href="index.html">◈ RuralReach <b>AI</b></a><nav><a href="dashboard.html">Dashboard</a><a href="lectures.html">Library</a><a href="assistant.html">AI Tutor</a></nav><span class="network"><i class="status-dot"></i><span class="connection-text">Online</span></span></header>
<main class="page"><label>OFFLINE LEARNING PLAYER</label><h1 id="playerTitle">Loading...</h1>
<div class="player panel"><div id="videoWrap" class="video-wrap" hidden><video id="video" controls playsinline preload="metadata"></video><div class="video-meta"><span id="offlineBadge">Local Faculty Content</span><span id="fileInfo"></span></div></div><div class="slide" id="slide"><label id="offlineBadge2">CACHED CONTENT</label><h2 id="slideTitle">Lecture Content</h2><p id="slideText">Available on this device.</p><b>✓ Available Offline</b></div><p id="faculty" class="muted"></p><p id="description" class="muted"></p>
<div class="buttons"><button id="previousBtn">← Previous</button><button id="playBtn" class="btn">▶ Learn +10%</button><button id="nextBtn">Next →</button></div>
<div class="track"><div id="playerProgressFill"></div></div><div class="row"><span id="progressText">0%</span><span>Local progress</span></div></div>
<div id="notesFileWrap" class="panel" hidden><label>FACULTY NOTES</label><p id="notesFileName" class="muted">Lecture notes</p><button id="downloadNotes" class="btn">⬇ Open / Save Notes Offline</button></div><div class="panel"><label>PERSONAL NOTES</label><textarea id="notes" class="notes" placeholder="Write your key points..."></textarea><button id="saveNotes" class="btn">Save Notes</button><span id="noteSaved"></span></div>
<a class="link" href="lectures.html">← Back to Library</a></main>
<footer>RuralReach AI</footer><script src="js/app.js"></script><script src="js/player.js"></script></body></html>
